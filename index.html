<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FuturoVerse - AI Smart Classroom &amp; Curriculum Platform</title>

    <!-- Primary SEO Meta Tags -->
    <meta name="description" content="FuturoVerse is a multilingual AI-powered smart classroom platform for educators and students worldwide — featuring AI quizzes, voice tutoring, mind maps, automated gradebooks, and real-time analytics." />
    <meta name="keywords" content="AI classroom, smart education, multilingual learning, AI tutor, quiz engine, edtech, LMS, gradebook, curriculum, bilingual education" />
    <meta name="author" content="FuturoVerse Team" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://futuroverse.vercel.app/" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0d9488" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FuturoVerse" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FuturoVerse" />
    <meta property="og:url" content="https://futuroverse.vercel.app/" />
    <meta property="og:title" content="FuturoVerse - AI Smart Classroom &amp; Curriculum Platform" />
    <meta property="og:description" content="Multilingual AI-powered smart classroom for educators and students worldwide. Generate quizzes, mind maps, voice tutoring, and analytics in seconds." />
    <meta property="og:image" content="https://futuroverse.vercel.app/logo.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="FuturoVerse AI Smart Classroom Platform" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@FuturoVerseAI" />
    <meta name="twitter:creator" content="@FuturoVerseAI" />
    <meta name="twitter:url" content="https://futuroverse.vercel.app/" />
    <meta name="twitter:title" content="FuturoVerse - AI Smart Classroom" />
    <meta name="twitter:description" content="Multilingual AI-powered smart classroom for educators and students worldwide. AI quizzes, voice tutoring, analytics and more." />
    <meta name="twitter:image" content="https://futuroverse.vercel.app/logo.jpg" />

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {
            // Service worker registration failed, app works normally without it
          });
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
